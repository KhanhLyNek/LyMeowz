name: Decompile LyMeowz client JAR

on:
  push:
    branches:
      - client-src/decompile-lymeowz
    paths:
      - .github/workflows/decompile-lymeowz.yml
      - .github/scripts/decompile_lymeowz.py
      - LyMeowz.jar
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decompile-client:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate input JAR without executing it
        run: |
          test -s LyMeowz.jar
          unzip -t LyMeowz.jar >/dev/null
          sha256sum LyMeowz.jar
      - name: Download CFR 0.152 decompiler
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            https://repo.maven.apache.org/maven2/org/benf/cfr/0.152/cfr-0.152.jar \
            --output /tmp/cfr-0.152.jar
          test "$(stat -c%s /tmp/cfr-0.152.jar)" -gt 1000000
      - name: Recover Java classes into ClientSRC/src
        run: |
          mkdir -p ClientSRC/src
          java -Xmx2g -jar /tmp/cfr-0.152.jar LyMeowz.jar \
            --outputdir ClientSRC/src --silent true
      - name: Extract non-class resources and write report
        run: python3 .github/scripts/decompile_lymeowz.py
      - name: Commit recovered SRC to this dedicated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ClientSRC/
          if git diff --cached --quiet; then
            echo "No source changes"
          else
            git commit -m "Add decompiled LyMeowz client SRC and resources"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
