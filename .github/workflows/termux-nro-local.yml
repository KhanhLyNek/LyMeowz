name: Termux Local NRO Launchers

on:
  push:
    branches:
      - termux/nro-local
    paths:
      - Termux/**
      - .github/workflows/termux-nro-local.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell-check-and-offline-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Shell syntax validation
        run: |
          bash -n Termux/nroctl
          bash -n Termux/install.sh
          bash -n Termux/tests/test_launcher.sh
      - name: Inert offline launcher tests
        run: bash Termux/tests/test_launcher.sh
      - name: Verify old Server.jar is available from history, without executing it
        run: |
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 --silent --show-error \
            https://raw.githubusercontent.com/KhanhLyNek/LyMeowz/b290d4c3359a9b5718b9274280f41b5f4ca6a4a8/Server/Server.jar \
            -o "$tmp"
          test "$(git hash-object "$tmp")" = 1cd01f6f486c7045c5c741e9514496c84d105cfe
          unzip -t "$tmp" >/dev/null
          echo "PASS: historical Server.jar archive hash and ZIP integrity, no JAR execution"

