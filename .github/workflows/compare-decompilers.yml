name: Compare CFR and Vineflower for LyMeowz client

on:
  push:
    branches: [client-src/workbench]
    paths:
      - .github/workflows/compare-decompilers.yml
      - ClientDev/tools/compare_decompilers.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compare-lymeowz-decompilers
  cancel-in-progress: true

jobs:
  compare-decompilers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download pinned Vineflower 1.12.0
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            https://repo.maven.apache.org/maven2/org/vineflower/vineflower/1.12.0/vineflower-1.12.0.jar \
            -o /tmp/vineflower-1.12.0.jar
          test "$(stat -c%s /tmp/vineflower-1.12.0.jar)" -gt 1000000
      - name: Decompile original JAR as an alternative to CFR
        run: |
          mkdir -p ClientDev/.build/vineflower-src ClientDev/.build ClientDev/recovery-vineflower
          java -Xmx4g -jar /tmp/vineflower-1.12.0.jar --folder \
            LyMeowz.jar ClientDev/.build/vineflower-src \
            > ClientDev/.build/vineflower.log 2>&1
          echo "JAVA COUNT:"
          find ClientDev/.build/vineflower-src -type f -name '*.java' | wc -l
          test "$(find ClientDev/.build/vineflower-src -type f -name '*.java' | wc -l)" -gt 100
      - name: Normalize alternative default-package classes for syntax comparison
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("ClientDev/.build/vineflower-src")
          changed = 0
          for path in root.rglob("*.java"):
              if path.parent != root:
                  continue
              original = path.read_text(encoding="utf-8", errors="replace")
              if not original.lstrip().startswith("package "):
                  path.write_text("package main;\n\n" + original, encoding="utf-8")
                  changed += 1
          print("NORMALIZED_DEFAULT_PACKAGE_FILES:", changed)
          PY
      - name: Compile alternative Java ME sources (diagnostic only)
        run: |
          set -e
          mkdir -p ClientDev/.lib ClientDev/.build/vineflower-classes
          for artifact in cldcapi11 midpapi20; do
            curl --fail --location --retry 3 --silent --show-error \
              "https://repo.maven.apache.org/maven2/org/microemu/$artifact/2.0.4/$artifact-2.0.4.jar" \
              -o "ClientDev/.lib/$artifact-2.0.4.jar"
          done
          find ClientDev/.build/vineflower-src -type f -name '*.java' | sort \
            > ClientDev/.build/vineflower-sources.txt
          set +e
          javac --release 8 -encoding UTF-8 -Xmaxerrs 300 \
            -cp ClientDev/.lib/cldcapi11-2.0.4.jar:ClientDev/.lib/midpapi20-2.0.4.jar \
            -d ClientDev/.build/vineflower-classes \
            @ClientDev/.build/vineflower-sources.txt \
            > ClientDev/.build/vineflower-javac.log 2>&1
          rc=$?
          set -e
          printf '\nCOMPILER_EXIT_CODE=%s\n' "$rc" >> ClientDev/.build/vineflower-javac.log
          echo "Vineflower javac exit code: $rc"
          exit 0
      - name: Compare compiler diagnostics and preserve target recovery class
        run: |
          python3 ClientDev/tools/compare_decompilers.py \
            ClientDev/.build/vineflower-src \
            ClientDev/.build/vineflower-javac.log
          if [ -f ClientDev/.build/vineflower-src/I1I1.java ]; then
            cp ClientDev/.build/vineflower-src/I1I1.java \
              ClientDev/recovery-vineflower/I1I1.java
          fi
      - name: Upload alternative sources and compile logs for further analysis
        uses: actions/upload-artifact@v4
        with:
          name: lymeowz-vineflower-alternative
          if-no-files-found: warn
          retention-days: 7
          path: |
            ClientDev/.build/vineflower-src/**/*.java
            ClientDev/.build/vineflower-src/*.java
            ClientDev/reports/decompiler-comparison.md
            ClientDev/.build/vineflower-javac.log
      - name: Commit comparison report and alternate target class
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ClientDev/reports/decompiler-comparison.md
          if test -f ClientDev/recovery-vineflower/I1I1.java; then
            git add ClientDev/recovery-vineflower/I1I1.java
          fi
          if git diff --cached --quiet; then
            echo "No new results"
          else
            git commit -m "Record Vineflower recovery comparison for obfuscated client"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
