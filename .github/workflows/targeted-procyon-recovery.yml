name: Targeted Procyon Recovery (I1I1)

on:
  push:
    branches: [client-src/workbench]
    paths:
      - .github/workflows/targeted-procyon-recovery.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decompile-target-class:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download and checksum-verify Procyon 0.6.0
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/mstrobel/procyon/releases/download/v0.6.0/procyon-decompiler-0.6.0.jar \
            -o /tmp/procyon-decompiler-0.6.0.jar
          echo '821da96012fc69244fa1ea298c90455ee4e021434bc796d3b9546ab24601b779  /tmp/procyon-decompiler-0.6.0.jar' | sha256sum -c -
      - name: Extract one obfuscated class from original archive (no executing code)
        run: |
          mkdir -p ClientDev/.build/procyon-target
          unzip -p LyMeowz.jar I1I1.class > ClientDev/.build/procyon-target/I1I1.class
          test -s ClientDev/.build/procyon-target/I1I1.class
      - name: Recover problematic class using alternative decompiler
        run: |
          mkdir -p ClientDev/recovery-procyon
          timeout 180s java -Xmx2g -jar /tmp/procyon-decompiler-0.6.0.jar \
            ClientDev/.build/procyon-target/I1I1.class \
            -o ClientDev/recovery-procyon \
            > /tmp/procyon.log 2>&1
          test -s ClientDev/recovery-procyon/I1I1.java
      - name: Audit recovered target class
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          files = {
            'CFR': Path('ClientDev/src/I1I1.java'),
            'Procyon': Path('ClientDev/recovery-procyon/I1I1.java'),
          }
          text = ['# I1I1.java recovery comparison', '',
                  'Only the single class was processed. All results are experimental.',
                  '',
                  '| Method | Java lines | Invalid GOTO markers |',
                  '|---|---:|---:|']
          for name, path in files.items():
              source = path.read_text(encoding='utf-8', errors='replace')
              goto = len(re.findall(r'\*\*\s+GOTO\b', source))
              text.append(f'| {name} | {source.count(chr(10)) + 1} | {goto} |')
              print(f'{name}: invalid-GOTO={goto}, source-bytes={len(source.encode())}')
          text += ['', 'Changing to this alternative cannot be treated as an automatic fix.',
                   'Cross-class symbol renaming and Java ME compilation remain unverified.']
          Path('ClientDev/reports/procyon-target.md').write_text(
              '\n'.join(text) + '\n', encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: procyon-I1I1-recovery
          path: |
            ClientDev/recovery-procyon/I1I1.java
            ClientDev/reports/procyon-target.md
      - name: Commit target recovery to workbench (not main)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ClientDev/recovery-procyon/I1I1.java ClientDev/reports/procyon-target.md
          if ! git diff --cached --quiet; then
            git commit -m "Preserve Procyon alternative for obfuscated I1I1 class"
            git fetch origin client-src/workbench
            git rebase origin/client-src/workbench
            git push origin HEAD:client-src/workbench
          fi
