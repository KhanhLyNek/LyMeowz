name: Build LyMeowz Offline J2ME
on:
  push:
    paths:
      - 'OfflineJ2ME/**'
      - '.github/workflows/lymeowz-j2me-offline.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and test J2ME MIDlet
        run: cd OfflineJ2ME && sh build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: LyMeowz-Offline-J2ME
          path: |
            OfflineJ2ME/dist/LyMeowz-Offline-J2ME.jar
            OfflineJ2ME/dist/LyMeowz-Offline-J2ME.jad
