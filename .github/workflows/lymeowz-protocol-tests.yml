name: LyMeowz Packet Framing Tests

on:
  push:
    branches:
      - client-src/workbench
    paths:
      - ClientDev/protocol/**
      - .github/workflows/lymeowz-protocol-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-packet-format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile and test packet framing
        run: bash ClientDev/protocol/test.sh
